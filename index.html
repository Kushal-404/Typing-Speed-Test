<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Typecast — Typing Speed Test</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Custom Stylesheet link -->
  <link rel="stylesheet" href="style.css">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body class="min-h-screen text-[var(--ink)] flex flex-col items-center px-4 py-10 md:py-16">
 
  <!-- Header -->
  <header class="w-full max-w-4xl flex items-center justify-between mb-10 md:mb-14">
    <div class="flex items-baseline gap-2">
      <h1 class="text-xl md:text-2xl font-semibold tracking-tight">Typecast</h1>
      <span class="mono text-[11px] text-[var(--muted)] hidden sm:inline">— a typing speed test</span>
    </div>
    <div class="flex items-center gap-1 mono text-xs" id="timeSelector">
      <!-- time pills injected -->
    </div>
  </header>
 
  <!-- Main -->
  <main class="w-full max-w-5xl grid grid-cols-1 md:grid-cols-[300px_1fr] gap-6 md:gap-8 items-start">
 
    <!-- Fight scene (left) -->
    <section class="bg-[var(--card)] border border-[var(--hairline)] rounded-2xl p-5 md:p-6 shadow-2xl shadow-black/40 md:sticky md:top-10">
      <div class="flex items-center justify-between mb-3">
        <h2 class="mono text-[11px] uppercase tracking-widest text-[var(--muted)]">Duel</h2>
        <span class="mono text-[11px] text-[var(--muted)]"><span id="hitCount" class="text-[var(--brass)] font-medium">0</span> hits landed</span>
      </div>
      <svg id="fightScene" viewBox="0 0 320 220" class="w-full h-auto">
        <!-- ground -->
        <line x1="14" y1="196" x2="306" y2="196" stroke="var(--hairline)" stroke-width="2"/>
 
        <!-- attacker -->
        <g id="attacker">
          <g class="stick">
            <circle cx="80" cy="66" r="13"/>
            <line x1="80" y1="79" x2="80" y2="140"/>
            <line x1="80" y1="140" x2="63" y2="192"/>
            <line x1="80" y1="96" x2="63" y2="115"/>
          </g>
          <g id="frontLegStatic" class="stick">
            <line x1="80" y1="140" x2="94" y2="192"/>
          </g>
          <g id="kickLeg" class="stick">
            <line x1="80" y1="140" x2="94" y2="192"/>
          </g>
          <g id="swordArm">
            <g class="stick">
              <line x1="80" y1="96" x2="106" y2="112"/>
              <line x1="106" y1="112" x2="146" y2="86"/>
              <line x1="121" y1="106" x2="131" y2="120"/>
            </g>
          </g>
          <g id="punchArm" class="stick">
            <line x1="80" y1="96" x2="114" y2="96"/>
            <circle cx="114" cy="96" r="4"/>
          </g>
        </g>
 
        <!-- impact spark -->
        <g id="spark" class="stick" stroke="var(--brass)">
          <line x1="185" y1="86" x2="205" y2="106"/>
          <line x1="205" y1="86" x2="185" y2="106"/>
          <line x1="195" y1="76" x2="195" y2="116"/>
        </g>
 
        <!-- defender -->
        <g id="defender">
          <g class="stick">
            <circle cx="240" cy="66" r="13"/>
            <line x1="240" y1="79" x2="240" y2="140"/>
            <line x1="240" y1="140" x2="223" y2="192"/>
            <line x1="240" y1="140" x2="257" y2="192"/>
            <line x1="240" y1="96" x2="223" y2="115"/>
            <line x1="240" y1="96" x2="257" y2="115"/>
          </g>
        </g>
      </svg>
 
      <div class="flex items-center justify-between mt-3">
        <p class="mono text-[11px] text-[var(--muted)]">type each letter to attack</p>
        <span class="mono text-[11px] text-[var(--muted)]">combo <span id="comboCount" class="text-[var(--ink)] font-medium">0</span></span>
      </div>
      <div id="comboBadge" class="hidden-badge mt-3 text-center mono text-[10px] font-semibold text-[var(--brass)] bg-[rgba(217,164,65,0.1)] border border-[rgba(217,164,65,0.35)] rounded-md py-1.5">
        MULTI-FRAME COMBO ACTIVE
      </div>
    </section>
 
    <!-- Typing test (right) -->
    <div class="w-full">
 
    <!-- Carriage rail (signature element) -->
    <div class="paper-rail mb-8">
      <div class="carriage" id="carriage" style="left:0%"></div>
    </div>
 
    <!-- Typing surface -->
    <section id="typingCard" class="bg-[var(--card)] border border-[var(--hairline)] rounded-2xl p-6 md:p-10 shadow-2xl shadow-black/40">
 
      <!-- Stat strip -->
      <div class="flex items-center justify-between mb-6 md:mb-8">
        <div class="flex items-baseline gap-1.5">
          <span class="text-3xl md:text-4xl font-semibold tabular-nums" id="timerDisplay">60</span>
          <span class="mono text-xs text-[var(--muted)]">sec</span>
        </div>
        <div class="flex gap-6 mono text-xs text-[var(--muted)]">
          <div class="text-right">
            <div class="text-[var(--ink)] text-lg font-medium tabular-nums" id="liveWpm">0</div>
            <div>wpm</div>
          </div>
          <div class="text-right">
            <div class="text-[var(--ink)] text-lg font-medium tabular-nums" id="liveAcc">100</div>
            <div>acc</div>
          </div>
        </div>
      </div>
 
      <!-- Text display -->
      <div class="relative">
        <p id="textDisplay" class="mono text-lg md:text-2xl leading-relaxed md:leading-loose tracking-wide select-none" style="letter-spacing:0.02em;"></p>
        <input id="hiddenInput" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
          class="absolute opacity-0 pointer-events-none top-0 left-0 w-1 h-1" />
      </div>
 
      <!-- Footer controls -->
      <div class="flex items-center justify-between mt-8 pt-6 border-t border-[var(--hairline)]">
        <div class="flex items-center gap-2 text-[var(--muted)]">
          <span class="key-hint">tab</span><span class="mono text-xs">+</span><span class="key-hint">enter</span>
          <span class="mono text-xs ml-1">to restart</span>
        </div>
        <button id="restartBtn" class="group flex items-center gap-2 px-4 py-2 rounded-lg border border-[var(--hairline)] hover:border-[var(--brass)] transition-colors">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-[var(--muted)] group-hover:text-[var(--brass)] transition-colors">
            <path d="M1 4v6h6"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
          </svg>
          <span class="mono text-xs text-[var(--muted)] group-hover:text-[var(--brass)] transition-colors">restart</span>
        </button>
      </div>
 
    </section>
 
    <!-- Results panel -->
    <section id="resultsCard" class="hidden bg-[var(--card)] border border-[var(--hairline)] rounded-2xl p-8 md:p-12 shadow-2xl shadow-black/40 fade-in">
      <div class="flex items-center justify-between mb-8">
        <h2 class="text-lg font-semibold text-[var(--brass)]">Results</h2>
        <span class="mono text-xs text-[var(--muted)]" id="resultMeta"></span>
      </div>
      <div class="grid grid-cols-2 md:grid-cols-4 gap-6 mb-10">
        <div>
          <div class="text-4xl font-semibold tabular-nums" id="finalWpm">0</div>
          <div class="mono text-xs text-[var(--muted)] mt-1">words / min</div>
        </div>
        <div>
          <div class="text-4xl font-semibold tabular-nums" id="finalAcc">0</div>
          <div class="mono text-xs text-[var(--muted)] mt-1">% accuracy</div>
        </div>
        <div>
          <div class="text-4xl font-semibold tabular-nums text-[var(--bad)]" id="finalErrors">0</div>
          <div class="mono text-xs text-[var(--muted)] mt-1">errors</div>
        </div>
        <div>
          <div class="text-4xl font-semibold tabular-nums" id="finalChars">0</div>
          <div class="mono text-xs text-[var(--muted)] mt-1">characters</div>
        </div>
      </div>
      <button id="tryAgainBtn" class="w-full py-3 rounded-lg bg-[var(--brass)] text-[#14161a] font-semibold hover:brightness-110 transition">
        Type again
      </button>
    </section>
 
    </div>
  </main>
 
  <footer class="mt-10 mono text-[11px] text-[var(--muted)]">
    click anywhere and start typing — the clock starts on your first key
  </footer>
 
<script>
/* ---------------------------------------------------------
   DATA
--------------------------------------------------------- */
const PARAGRAPHS = [
  "The old lighthouse keeper climbed the spiral stairs every evening, counting each worn stone step as the wind pressed cold against the glass. Below him the sea folded quietly into darkness, patient and enormous, waiting for a light it already trusted would come.",
  "In the workshop, sawdust drifted through a single shaft of afternoon light while the carpenter turned a rough plank over in his hands, reading its grain like a sentence he had written himself years ago and was only now learning to finish.",
  "Somewhere between the second and third cup of coffee, the idea finally arrived, not as a flash but as a slow unfolding, the way fog lifts off a valley to reveal a road that had been there the entire time.",
  "The train pulled away from the platform just as the rain began, and through the fogged window the city blurred into soft shapes of orange light, each one a window, each window a small unfinished story rushing past.",
  "She kept the letter in the same drawer for eleven years, not because she planned to read it again but because throwing it away felt like erasing a version of herself that had once been brave enough to write it.",
  "The market opened before dawn, stalls lit by bare bulbs strung between poles, vendors calling out prices in voices already hoarse, the smell of ginger and diesel mixing in the cool air like two arguments that never resolve.",
  "A good bridge does not announce itself, the engineer said, tapping the blueprint with one finger, it simply lets you cross without ever noticing the river was a problem at all.",
  "By the time the museum closed, only the night guard remained, walking past paintings whose colors seemed to deepen in the low light, as though the pigments had been waiting all day for someone to finally slow down and look."
];
 
const TIME_OPTIONS = [15, 30, 60];
const DEFAULT_TIME = 60;
 
/* ---------------------------------------------------------
   STATE
--------------------------------------------------------- */
let state = {
  selectedTime: DEFAULT_TIME,
  timeLeft: DEFAULT_TIME,
  timerId: null,
  started: false,
  finished: false,
  currentText: "",
  typedChars: [],      // array of {char, correct: true|false|null}
  totalTyped: 0,
  totalCorrect: 0,
  totalErrors: 0,
  tabPressed: false,
};
 
/* ---------------------------------------------------------
   DOM REFS
--------------------------------------------------------- */
const el = {
  timeSelector: document.getElementById('timeSelector'),
  timerDisplay: document.getElementById('timerDisplay'),
  liveWpm: document.getElementById('liveWpm'),
  liveAcc: document.getElementById('liveAcc'),
  textDisplay: document.getElementById('textDisplay'),
  hiddenInput: document.getElementById('hiddenInput'),
  carriage: document.getElementById('carriage'),
  typingCard: document.getElementById('typingCard'),
  resultsCard: document.getElementById('resultsCard'),
  restartBtn: document.getElementById('restartBtn'),
  tryAgainBtn: document.getElementById('tryAgainBtn'),
  finalWpm: document.getElementById('finalWpm'),
  finalAcc: document.getElementById('finalAcc'),
  finalErrors: document.getElementById('finalErrors'),
  finalChars: document.getElementById('finalChars'),
  resultMeta: document.getElementById('resultMeta'),
  attacker: document.getElementById('attacker'),
  swordArm: document.getElementById('swordArm'),
  defender: document.getElementById('defender'),
  spark: document.getElementById('spark'),
  hitCount: document.getElementById('hitCount'),
  comboCount: document.getElementById('comboCount'),
  comboBadge: document.getElementById('comboBadge'),
};
 
let hitCount = 0;
let combo = 0;
let attackTimeout = null;
const ATTACK_TYPES = ['sword', 'punch', 'kick'];
const ATTACK_DURATIONS = { sword: 260, punch: 220, kick: 240 };
 
/* ---------------------------------------------------------
   FIGHT SCENE
--------------------------------------------------------- */
function pulse(elm, cls){
  elm.classList.remove(cls);
  void elm.getBoundingClientRect();
  elm.classList.add(cls);
}
 
function setAttackFrame(type){
  clearTimeout(attackTimeout);
  el.attacker.classList.remove('atk-sword', 'atk-punch', 'atk-kick');
  void el.attacker.getBoundingClientRect();
  el.attacker.classList.add('atk-' + type);
  attackTimeout = setTimeout(() => {
    el.attacker.classList.remove('atk-' + type);
  }, ATTACK_DURATIONS[type] + 40);
}
 
function updateComboBadge(){
  el.comboBadge.classList.toggle('hidden-badge', combo < 5);
}
 
function triggerAttack(){
  hitCount += 1;
  combo += 1;
  el.hitCount.textContent = hitCount;
  el.comboCount.textContent = combo;
  updateComboBadge();
 
  const type = ATTACK_TYPES[hitCount % ATTACK_TYPES.length];
  setAttackFrame(type);
  pulse(el.attacker, 'lunge');
  pulse(el.spark, 'spark-show');
 
  const knockback = Math.min(12 + combo * 1.6, 34);
  el.defender.style.setProperty('--kb', knockback.toFixed(1) + 'px');
  pulse(el.defender, 'hit');
}
 
function triggerMiss(){
  combo = 0;
  el.comboCount.textContent = 0;
  updateComboBadge();
  pulse(el.attacker, 'whiff');
}
 
/* ---------------------------------------------------------
   INIT TIME PILLS
--------------------------------------------------------- */
function renderTimePills(){
  el.timeSelector.innerHTML = "";
  TIME_OPTIONS.forEach(t => {
    const btn = document.createElement('button');
    btn.textContent = t + "s";
    btn.className = "time-pill px-3 py-1.5 rounded-md border border-[var(--hairline)] text-[var(--muted)]" +
      (t === state.selectedTime ? " active" : "");
    btn.addEventListener('click', () => {
      if (state.started && !state.finished) return; 
      state.selectedTime = t;
      resetTest();
    });
    el.timeSelector.appendChild(btn);
  });
}
 
/* ---------------------------------------------------------
   TEXT RENDERING
--------------------------------------------------------- */
function pickParagraph(){
  return PARAGRAPHS[Math.floor(Math.random() * PARAGRAPHS.length)];
}
 
function renderText(){
  el.textDisplay.innerHTML = "";
  const frag = document.createDocumentFragment();
  state.currentText.split("").forEach((ch, i) => {
    const span = document.createElement('span');
    span.textContent = ch;
    span.dataset.index = i;
    span.className = "char-pending";
    frag.appendChild(span);
  });
  el.textDisplay.appendChild(frag);
  updateCurrentCharMarker();
}
 
function updateCurrentCharMarker(){
  const spans = el.textDisplay.children;
  const idx = state.typedChars.length;
  Array.from(spans).forEach(s => s.classList.remove('char-current'));
  if (spans[idx]) spans[idx].classList.add('char-current');
 
  const pct = state.currentText.length ? (idx / state.currentText.length) * 100 : 0;
  el.carriage.style.left = pct + "%";
}
 
/* ---------------------------------------------------------
   TIMER
--------------------------------------------------------- */
function startTimer(){
  state.started = true;
  state.timerId = setInterval(() => {
    state.timeLeft -= 1;
    el.timerDisplay.textContent = state.timeLeft;
    updateLiveStats();
    if (state.timeLeft <= 0){
      finishTest();
    }
  }, 1000);
}
 
/* ---------------------------------------------------------
   METRICS
--------------------------------------------------------- */
function computeElapsedMinutes(){
  const elapsedSeconds = state.selectedTime - state.timeLeft;
  return Math.max(elapsedSeconds, 1) / 60; 
}
 
function updateLiveStats(){
  const minutes = computeElapsedMinutes();
  const wpm = Math.round((state.totalTyped / 5) / minutes);
  const acc = state.totalTyped > 0
    ? Math.round((state.totalCorrect / state.totalTyped) * 100)
    : 100;
  el.liveWpm.textContent = isFinite(wpm) && wpm > 0 ? wpm : 0;
  el.liveAcc.textContent = acc;
}
 
/* ---------------------------------------------------------
   INPUT HANDLING
--------------------------------------------------------- */
function handleKeydown(e){
  if (state.finished) return;
 
  if (e.key === 'Tab'){
    state.tabPressed = true;
    e.preventDefault();
    return;
  }
  if (e.key === 'Enter' && state.tabPressed){
    resetTest();
    return;
  }
  if (e.key !== 'Tab') state.tabPressed = false;
 
  if (e.key === 'Backspace'){
    e.preventDefault();
    if (state.typedChars.length > 0){
      const removed = state.typedChars.pop();
      state.totalTyped -= 1;
      if (removed.correct) state.totalCorrect -= 1;
      else state.totalErrors -= 1;
      const spans = el.textDisplay.children;
      const idx = state.typedChars.length;
      spans[idx].className = "char-pending";
      updateCurrentCharMarker();
      updateLiveStats();
    }
    return;
  }
 
  if (e.key.length !== 1) return;
  e.preventDefault();
 
  if (!state.started) startTimer();
 
  const idx = state.typedChars.length;
  if (idx >= state.currentText.length) return; 
 
  const expected = state.currentText[idx];
  const isCorrect = e.key === expected;
 
  state.typedChars.push({ char: e.key, correct: isCorrect });
  state.totalTyped += 1;
  if (isCorrect){
    state.totalCorrect += 1;
  } else {
    state.totalErrors += 1;
  }
 
  const span = el.textDisplay.children[idx];
  span.className = isCorrect ? "char-correct" : "char-incorrect";
 
  updateCurrentCharMarker();
  updateLiveStats();
 
  if (isCorrect){
    triggerAttack();
  } else {
    triggerMiss();
  }
 
  const reachedEnd = state.typedChars.length >= state.currentText.length;
  if (reachedEnd){
    finishTest();
  }
}
 
/* ---------------------------------------------------------
   FINISH / RESET
--------------------------------------------------------- */
function finishTest(){
  if (state.finished) return;
  state.finished = true;
  clearInterval(state.timerId);
 
  const minutes = computeElapsedMinutes();
  const finalWpm = Math.round((state.totalTyped / 5) / minutes);
  const finalAcc = state.totalTyped > 0
    ? Math.round((state.totalCorrect / state.totalTyped) * 100)
    : 100;
 
  el.finalWpm.textContent = isFinite(finalWpm) && finalWpm > 0 ? finalWpm : 0;
  el.finalAcc.textContent = finalAcc;
  el.finalErrors.textContent = state.totalErrors;
  el.finalChars.textContent = state.totalTyped;
  el.resultMeta.textContent = `${state.selectedTime}s test`;
 
  el.typingCard.classList.add('hidden');
  el.resultsCard.classList.remove('hidden');
}
 
function resetTest(){
  clearInterval(state.timerId);
  state = {
    selectedTime: state.selectedTime,
    timeLeft: state.selectedTime,
    timerId: null,
    started: false,
    finished: false,
    currentText: pickParagraph(),
    typedChars: [],
    totalTyped: 0,
    totalCorrect: 0,
    totalErrors: 0,
    tabPressed: false,
  };
 
  el.timerDisplay.textContent = state.timeLeft;
  el.liveWpm.textContent = 0;
  el.liveAcc.textContent = 100;
  el.carriage.style.left = "0%";
 
  el.resultsCard.classList.add('hidden');
  el.typingCard.classList.remove('hidden');
 
  hitCount = 0;
  combo = 0;
  clearTimeout(attackTimeout);
  el.hitCount.textContent = 0;
  el.comboCount.textContent = 0;
  el.comboBadge.classList.add('hidden-badge');
  el.defender.style.setProperty('--kb', '16px');
  el.attacker.classList.remove('atk-sword', 'atk-punch', 'atk-kick', 'lunge', 'whiff');
  [el.defender, el.spark].forEach(elm => {
    elm.classList.remove('hit', 'spark-show');
  });
 
  renderTimePills();
  renderText();
  focusInput();
}
 
function focusInput(){
  el.hiddenInput.focus({ preventScroll: true });
}
 
/* ---------------------------------------------------------
   WIRE UP
--------------------------------------------------------- */
document.addEventListener('keydown', handleKeydown);
document.addEventListener('click', focusInput);
el.restartBtn.addEventListener('click', resetTest);
el.tryAgainBtn.addEventListener('click', resetTest);
 
el.hiddenInput.addEventListener('blur', () => {
  if (!state.finished) setTimeout(focusInput, 10);
});
 
resetTest();
</script>
</body>
</html>
